<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testimoni - Nero Store</title>

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Poppins;
color:white;
}

/* video bg */
.video-bg{
position:fixed;
width:100%;
height:100%;
z-index:-2;
}

.video-bg video{
width:100%;
height:100%;
object-fit:cover;
}

.overlay{
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,.7);
z-index:-1;
}

/* fade */
.fade{
position:fixed;
width:100%;
height:100%;
background:black;
opacity:0;
transition:.4s;
z-index:999;
pointer-events:none;
}

.fade.show{
opacity:1;
}

/* layout */
.container{
padding:25px;
}

.title{
font-family:Anton;
font-size:40px;
letter-spacing:4px;
margin-bottom:20px;
}

.back{
display:inline-block;
border:2px solid white;
padding:6px 15px;
margin-bottom:20px;
cursor:pointer;
text-decoration:none;
color:white;
}

.back:hover{
background:white;
color:black;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
gap:15px;
}

.card{
border:2px solid white;
background:#111;
}

.card img{
width:100%;
height:200px;
object-fit:cover;
}

.content{
padding:10px;
font-size:13px;
}

.nama{
font-weight:bold;
margin-bottom:5px;
}

.pesan{
opacity:.8;
white-space:pre-line;
}

.penjual{
margin-top:8px;
font-size:12px;
opacity:.6;
}

</style>
</head>

<body>

<div class="video-bg">
<video autoplay muted loop>
<source src="b3.mp4">
</video>
</div>

<div class="overlay"></div>
<div class="fade" id="fade"></div>

<audio id="bgMusic" loop>
<source src="audio/music.mp3">
</audio>

<div class="container">

<a href="home.html" class="back">BACK</a>

<div class="title">TESTIMONI</div>

<div class="grid" id="testiList"></div>

</div>

<script>
window.onload = function(){
if(localStorage.getItem("nero_music") === "play"){
bgMusic.volume = 0.4
bgMusic.play()
}
}
</script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import {
getFirestore,
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCJomifys1cY-9ELI4Ft3Z5N-cLs2YQcVU",
authDomain: "nero-fa67c.firebaseapp.com",
projectId: "nero-fa67c",
storageBucket: "nero-fa67c.firebasestorage.app",
messagingSenderId: "349005489687",
appId: "1:349005489687:web:c27ce076b4f54da5275e52"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const list = document.getElementById("testiList")

const snap = await getDocs(collection(db,"testimoni"))

snap.forEach(doc=>{

const d = doc.data()

list.innerHTML += `
<div class="card">

<img src="${d.gambar}">

<div class="content">

<div class="nama">${d.nama}</div>

<div class="pesan">
${d.pesan}
</div>

<div class="penjual">
Penjual : ${d.penjual}
</div>

</div>

</div>
`

})

</script>

</body>
</html>
