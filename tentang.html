<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tentang - Nero Store</title>

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Poppins,sans-serif;
color:white;
}

/* video bg */
.video-bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-2;
overflow:hidden;
}

.video-bg video{
width:100%;
height:100%;
object-fit:cover;
}

.overlay{
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,.7);
z-index:-1;
}

.container{
padding:25px;
}

.title{
font-family:Anton;
font-size:42px;
letter-spacing:4px;
margin-bottom:20px;
}

.back{
display:inline-block;
border:2px solid white;
padding:6px 15px;
margin-bottom:20px;
cursor:pointer;
text-decoration:none;
color:white;
transition:.2s;
}

.back:hover{
background:white;
color:black;
transform:translate(-3px,-3px);
box-shadow:4px 4px 0 white;
}

.box{
border:2px solid white;
background:#111;
padding:20px;
margin-bottom:15px;
}

.box-title{
font-family:Anton;
letter-spacing:2px;
margin-bottom:15px;
}

/* profile grid */
.profile{
display:grid;
grid-template-columns:1fr 1fr;
gap:25px;
}

/* card */
.card{
border:2px solid white;
background:#111;
padding:15px;
text-align:center;
transition:.25s;
position:relative;
}

.card:hover{
transform:translateY(-8px);
box-shadow:0 0 25px rgba(255,255,255,.2);
}

/* foto anime glow */
.card img{
width:100%;
height:220px;
object-fit:cover;
border-radius:20px;
margin-bottom:12px;
transition:.3s;
box-shadow:0 0 15px rgba(255,255,255,.15);
}

.card:hover img{
box-shadow:
0 0 10px #fff,
0 0 20px #ff2e2e,
0 0 40px #ff2e2e;
}

.name{
font-size:16px;
margin-bottom:5px;
}

.role{
opacity:.6;
font-size:13px;
letter-spacing:1px;
}

/* responsive */
@media(max-width:700px){
.profile{
grid-template-columns:1fr;
}
}

</style>
</head>

<body>

<div class="video-bg">
<video autoplay muted loop>
<source src="b1.mp4">
</video>
</div>

<div class="overlay"></div>

<audio id="bgMusic" loop>
<source src="audio/music.mp3">
</audio>

<div class="container">

<a href="home.html" class="back">BACK</a>

<div class="title">TENTANG</div>

<div class="box">
<div class="box-title">TENTANG TOKO</div>
Nero Store adalah toko digital yang menjual akun Game
trusted dan aman. Semua akun dicek sebelum dijual dan
langsung dikirim setelah pembayaran.
</div>

<div class="box">
<div class="box-title">OWNER & ADMIN</div>

<div class="profile">

<div class="card">
<img src="owner.jpg">
<div class="name">Kenzy</div>
<div class="role">OWNER</div>
</div>

<div class="card">
<img src="admin.jpg">
<div class="name">Renzy</div>
<div class="role">ADMIN</div>
</div>

</div>

</div>

</div>

<script>
window.onload = function(){
if(localStorage.getItem("nero_music") === "play"){
bgMusic.volume = 0.4
bgMusic.play()
}
}
</script>

</body>
</html>
