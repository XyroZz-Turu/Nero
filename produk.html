<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produk - Nero Store</title>

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Poppins,sans-serif;
color:white;
}

/* video background */
.video-bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-2;
overflow:hidden;
}

.video-bg video{
width:100%;
height:100%;
object-fit:cover;
}

/* overlay */
.overlay{
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,.65);
z-index:-1;
}

/* fade */
.fade{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
opacity:0;
transition:.4s;
z-index:999;
pointer-events:none;
}

.fade.show{
opacity:1;
}

/* layout */
.container{
padding:25px;
}

.title{
font-family:Anton;
font-size:40px;
letter-spacing:4px;
margin-bottom:20px;
}

.back{
display:inline-block;
border:2px solid white;
padding:6px 15px;
margin-bottom:20px;
cursor:pointer;
text-decoration:none;
color:white;
}

.back:hover{
background:white;
color:black;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:15px;
}

.card{
border:2px solid white;
background:#111;
position:relative;
}

.badge{
position:absolute;
top:10px;
right:10px;
background:red;
padding:3px 8px;
font-size:10px;
}

.ready{
background:green;
}

.card img{
width:100%;
height:140px;
object-fit:cover;
}

.content{
padding:10px;
}

.kode{
font-size:12px;
opacity:.7;
}

.nama{
margin:5px 0;
}

.spek,
.login{
font-size:12px;
opacity:.8;
margin:6px 0;
white-space:pre-line;
}

.harga{
margin-top:8px;
font-weight:bold;
}

.buy{
border:1px solid white;
text-align:center;
padding:6px;
margin-top:8px;
cursor:pointer;
}

.buy:hover{
background:white;
color:black;
}
</style>
</head>

<body>

<!-- VIDEO BG -->
<div class="video-bg">
<video autoplay muted loop>
<source src="b2.mp4">
</video>
</div>

<div class="overlay"></div>
<div class="fade" id="fade"></div>

<!-- AUDIO -->
<audio id="bgMusic" loop>
<source src="music.mp3">
</audio>

<div class="container">

<a href="home.html" class="back">BACK</a>

<div class="title">PRODUK</div>

<div class="grid" id="produkList"></div>

</div>

<script>

/* MUSIC SAFE */
window.onload = function(){
let music = document.getElementById("bgMusic");
if(localStorage.getItem("nero_music") === "play"){
music.volume = 0.4;
music.play();
}
};

/* FORMAT HARGA */
function formatHarga(x){
return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g,".");
}

/* BUY SYSTEM (WA) */
function beli(kode,nama,harga,wa){

let pesan =
`Halo admin Nero Store

Saya mau beli akun FF

Kode : ${kode}
Produk : ${nama}
Harga : Rp ${formatHarga(harga)}

Masih ready?`;

let url = "https://wa.me/"+wa+"?text="+encodeURIComponent(pesan);
window.location.href = url;
}

</script>

<!-- FIREBASE SAFE VERSION -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getFirestore,collection,getDocs } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCJomifys1cY-9ELI4Ft3Z5N-cLs2YQcVU",
authDomain: "nero-fa67c.firebaseapp.com",
projectId: "nero-fa67c",
storageBucket: "nero-fa67c.firebasestorage.app",
messagingSenderId: "349005489687",
appId: "1:349005489687:web:c27ce076b4f54da5275e52"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const list = document.getElementById("produkList");

/* SAFE LOAD */
try{

const snap = await getDocs(collection(db,"produk"));

snap.forEach(doc=>{

const d = doc.data();

list.innerHTML += `
<div class="card">

<div class="badge ${d.status=="ready"?"ready":""}">
${d.status=="ready"?"READY":"SOLD"}
</div>

<img src="${d.gambar}">

<div class="content">

<div class="kode">Kode : ${d.kode}</div>
<div class="nama">${d.nama}</div>

<div class="spek">
Spek:
${d.spek}
</div>

<div class="login">
Login:
${d.login}
</div>

<div class="harga">
Rp ${formatHarga(d.harga)}
</div>

<div class="buy" onclick="beli('${d.kode}','${d.nama}','${d.harga}','${d.wa}')">
BELI
</div>

</div>
</div>
`;

});

}catch(err){
console.log("Firestore error:",err);
list.innerHTML = "<p style='opacity:.6'>Produk belum tersedia</p>";
}

</script>

</body>
</html>
